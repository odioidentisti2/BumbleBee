<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumblebee - Test</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body class="test-page" data-device="{{ device }}" data-page-label="TEST">
<!-- device can be removed -->

  <header id="shared-header"></header>

  <main class="main-split">
    <section class="panel controls"></section>
    <section class="panel console" data-prompt="> Upload a" data-blink-target="TEST SET"></section>
  </main>

  <footer class="nav-bar">
    <div class="nav-group">
      <button type="button" class="nav-button" data-href="/train">&lt;</button>
      <span class="nav-label">TRAIN</span>
    </div>
    <div class="nav-group">
      <span class="nav-label">EXPLAIN</span>
      <!-- TODO: add data-href once the EXPLAIN page exists -->
      <button type="button" class="nav-button nav-next" disabled>&gt;</button>
    </div>
  </footer>

  <script src="/static/shared.js"></script>
  <script src="/static/output-console.js"></script>
  <script src="/static/control-panel.js"></script>
  <script src="/static/csv-preview.js"></script>
</body>

</html>
