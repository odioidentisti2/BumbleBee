<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumblebee Training</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="train-page" data-device="{{ device }}" data-page-label="TRAINING">
  <header id="shared-header"></header>

  <main class="main-split">

    <section class="panel left">
      <input id="trainingSetInput" class="hidden-file-input" type="file" accept=".csv" aria-label="Load a training set">
      <label for="trainingSetInput" class="load-set-button" aria-label="Load a training set">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 7h6l2 2h8v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7z"></path>
        </svg>
      </label>
      <div id="trainingSetText" class="load-set-text">Browse a TRAINING SET...</div>
    </section>

    <section class="panel right"></section>

  </main>

  <footer id="shared-footer"></footer>
  <script src="shared.js"></script>
  <script src="train.js"></script>
</body>
</html>
