<!DOCTYPE html>
<html lang="en">
  
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bumblebee Training</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="train-page" data-device="{{ device }}" data-page-label="TRAIN">

  <header id="shared-header"></header>

  <main class="main-split">
    <section class="panel controls" data-browse-label="Upload a" data-target-label="TRAINING SET" data-output-target="#trainOutputConsole"></section>
    <section id="trainOutputConsole" class="panel console" data-blink-target="TRAINING SET"></section>
  </main>

  <footer id="shared-footer"></footer>

  <script src="shared.js"></script>
  <script src="control-panel.js"></script>
  <script src="output-console.js"></script>
  <script src="train.js"></script>

</body>
</html>
